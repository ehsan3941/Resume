<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Ehsan Ali</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container { background: white; padding: 60px 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; max-width: 500px; margin: 20px; }
        .checkmark { width: 80px; height: 80px; border-radius: 50%; background: #4CAF50; margin: 0 auto 30px; display: flex; align-items: center; justify-content: center; font-size: 50px; color: white; }
        h1 { color: #333; margin-bottom: 20px; font-size: 2em; }
        p { color: #666; line-height: 1.6; margin-bottom: 30px; font-size: 1.1em; }
        .btn { display: inline-block; background: #667eea; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; transition: 0.3s; font-weight: 500; }
        .btn:hover { background: #764ba2; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Thank You!</h1>
